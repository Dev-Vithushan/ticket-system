name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket
          POSTGRES_DB: ticket_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticket" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ticket:ticket@localhost:5432/ticket_test?schema=public
      DATABASE_URL: postgresql://ticket:ticket@localhost:5432/ticket_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --workspace apps/api prisma generate
      - name: Typecheck
        run: npm run lint
      - name: API tests (unit + integration against PostgreSQL)
        run: npm run test -w apps/api
      - name: Web tests
        run: npm run test -w apps/web
      - name: Build
        run: npm run build
